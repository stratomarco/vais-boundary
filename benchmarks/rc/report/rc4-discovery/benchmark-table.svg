<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="958" viewBox="0 0 1500 958" role="img" aria-labelledby="title desc">
<title id="title">VAIS release-candidate model benchmark</title>
<desc id="desc">Cross-model benchmark table with bounded security and utility measurements.</desc>
<rect width="100%" height="100%" fill="#08111f"/>
<text x="42" y="52" fill="#f8fafc" font-family="Arial" font-size="30" font-weight="700">VAIS cross-model security benchmark</text>
<text x="42" y="84" fill="#94a3b8" font-family="Arial" font-size="16">15 models · 9 families · Q4_K_M · 8,192 context · RTX 4080 Super 16 GB</text>
<text x="42" y="118" fill="#cbd5e1" font-family="Arial" font-size="15">WHAT: 20 attack stories × 12 adaptive episodes = 240 attempted episodes per completed model.</text>
<text x="42" y="146" fill="#cbd5e1" font-family="Arial" font-size="15">WHY: VAIS tests whether protected observable effects preserve invariants while the attacked workflow remains useful.</text>
<text x="42" y="174" fill="#94a3b8" font-family="Arial" font-size="14">READ: each row shows its highest reached stage; VIOL. is independently verified violations/evaluable; UTILITY is successful workflows/evaluable.</text>
<text x="42" y="198" fill="#64748b" font-family="Arial" font-size="13">No composite score. Attack-added events are diagnostic drift, not the terminal security reward. Every percentage shows its denominator.</text>
<text x="42" y="224" fill="#64748b" font-family="Arial" font-size="13">MODEL</text><text x="360" y="224" fill="#64748b" font-family="Arial" font-size="13">FAMILY</text><text x="515" y="224" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="13">EVAL</text><text x="680" y="224" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="13">VIOL.</text><text x="875" y="224" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="13">UTILITY</text><text x="1070" y="224" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="13">ATTACK-ADDED</text><text x="1240" y="224" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="13">CONFIG</text><text x="1400" y="224" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="13">STATUS</text>
