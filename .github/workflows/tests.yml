name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m vais validate-policy policies/default.yaml
      - run: python -m vais validate-invariants invariants/default.yaml
      - run: python -m vais benchmark-default --mode protected --fail-on-protected-violation --fail-on-clean-utility-loss --fail-on-target-failure --output results/ci-protected.jsonl

  package-smoke:
    name: wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse

      - name: Install built wheel with dependencies
        run: |
          python -m pip install --force-reinstall wheelhouse/verifiable_ai_security-*.whl
          python -m pip check

      - name: Verify installed package
        run: |
          python -c "from importlib.metadata import version; import vais; assert vais.__version__ == version('verifiable-ai-security'); policy = vais.load_default_policy(); assert policy.default_action == 'deny'; assert policy.tools"
          vais version
