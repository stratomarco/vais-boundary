# Frozen 1.0 sample: gateway configuration version 2 (adds observe_until). Every path is relative to this file.
version: 2
listen: {host: 127.0.0.1, port: 8765}
policy: policy.yaml
profile: profile.yaml
contracts: contracts/          # operator-owned: one file per session, see contract.example.yaml
approvals: approvals.json      # operator-owned: written by `vais gateway-approve`
pending: pending/              # operator-owned: approval requests the gateway writes
audit: audit.jsonl
state: state/                  # session ledgers and context, kept across restarts
revocations: revocations.json  # operator-owned: written by `vais gateway-revoke`
reason_disclosure: decision    # the agent is told the outcome only; the audit keeps the reasons
upstreams:
  ops:
    stdio:
      command: python
      args: [../mcp_vulnerable_server.py]
      cwd: .
      # Resolved from the gateway's environment at startup. The agent never sees it.
      env: {OPS_API_KEY: "${env:OPS_API_KEY}"}
# Version 2 adds observe-only mode: forward and audit, at most 14 days ahead of starting.
observe_until: 2026-11-01T00:00:00Z
