decisions:
  - id: DEC-001
    date: 2026-08-11
    decision: Treat the model as an untrusted component rather than the security boundary.
    rationale: Security authorization and effect constraints must remain enforceable under model compromise.
    evidence: [docs/philosophy.md, CHANGELOG.md]

  - id: DEC-002
    date: 2026-08-11
    decision: Keep VAIS security decisions deterministic and do not place an LLM judge in the authorization path.
    rationale: Security properties should be reproducible, auditable, and independent of another stochastic model.
    evidence: [docs/architecture.md, docs/security-invariants.md]

  - id: DEC-003
    date: 2026-08-11
    decision: Separate behavior diagnostics from observable security impact.
    rejected: [model refusal as security proof, attack influence as impact, plan drift as impact]
    evidence: [docs/v0.5.1-measurement-correctness.md]

  - id: DEC-004
    date: 2026-08-11
    decision: Treat inbound MCP data as non-authoritative information by default and mediate outbound MCP calls through VAIS.
    evidence: [docs/mcp-security.md]

  - id: DEC-005
    date: 2026-08-12
    decision: Treat NOT_CALLED only as evidence that a proposed call did not cross the protected boundary, not as proof of attack prevention.
    evidence: [docs/v0.8.1-measurement-direction.md]

  - id: DEC-006
    date: 2026-08-12
    decision: Use matched control workflows to attribute attack-added security behavior instead of assuming all attacked-run behavior is caused by the attack.
    evidence: [CHANGELOG.md]

  - id: DEC-007
    date: 2026-08-12
    decision: Separate application-exposed tools from task-authorized tools.
    rationale: Technical availability must not imply task authority.
    evidence: [CHANGELOG.md]

  - id: DEC-008
    date: 2026-08-12
    decision: Use opaque trusted public-artifact IDs for declassification rather than allowing model-generated text to downgrade confidentiality.
    evidence: [CHANGELOG.md]

  - id: DEC-009
    date: 2026-08-13
    decision: Freeze v0.9.3 reference-system authorization semantics before adaptive verification.
    rationale: Adaptive attack evaluation must not change the defense while measuring it.
    evidence: [CHANGELOG.md]

  - id: DEC-010
    date: 2026-08-13
    decision: Define terminal adaptive reward as 1 only for an independently observed protected invariant violation, 0 only for a target-valid protected non-violation, and unevaluated on target generation failure.
    rejected: [LLM judge success, behavioral drift, attack-objective success, monitor DENY, MCP NOT_CALLED]
    evidence: [docs/v0.10-adaptive-verification.md, CHANGELOG.md]

  - id: DEC-011
    date: 2026-08-13
    decision: Do not expose internal reference-monitor policy reasons to the adaptive attacker feedback interface.
    rationale: The attacker may observe outcome classes and verifier evidence without being given implementation-internal authorization rationale.
    evidence: [CHANGELOG.md]

  - id: DEC-012
    date: 2026-08-13
    decision: Make the research evidence base canonical in text/YAML/JSON and generate SQLite from those sources plus immutable experiment artifacts.
    rationale: Git-reviewable evidence and decisions should remain authoritative; the database is a query/index layer, not the sole source of truth.

  - id: DEC-013
    date: 2026-08-13
    decision: Distinguish historical artifact and experiment instances from content-addressed unique evidence when summarizing the research archive.
    rationale: Historical version folders intentionally preserve copied artifacts for provenance; counting every copy as an independent experiment or observation would overstate the empirical evidence base.
    evidence: [docs/v0.10.2-research-integrity.md]

  - id: DEC-014
    date: 2026-08-14
    decision: Bind persistent exact approvals to action, principal, session, tenant and capability and consume them atomically once.
    rationale: An action-only reusable fingerprint cannot distinguish legitimate reuse from cross-context replay.
    evidence: [docs/v0.11-tcb-hardening.md, tests/test_tcb_hardening.py]

  - id: DEC-015
    date: 2026-08-14
    decision: Treat an MCP exception after dispatch as an indeterminate effect and prohibit automatic retry without application-specific reconciliation.
    rationale: A transport failure cannot establish whether the remote side effect occurred.
    evidence: [docs/v0.11-tcb-hardening.md, tests/test_mcp.py]

  - id: DEC-016
    date: 2026-08-15
    decision: Separate RC qualification, screening and full campaigns, and generate public graphics only from validated single-target summary artifacts.
    rationale: Compatibility failures and missing runs must remain visible rather than becoming favorable security outcomes or inferred scores.
    evidence: [docs/v0.12-rc-benchmark.md, tests/test_rc_benchmark.py]

  - id: DEC-017
    date: 2026-08-16
    decision: Treat requested reasoning mode as experiment metadata and observed reasoning activity as the conformance evidence; a mismatch invalidates cohort comparability but is not a security reward or protected invariant violation.
    rationale: Compatibility endpoints may accept or ignore model-specific reasoning controls, so configuration claims must be checked against recorded runtime behavior.
    evidence: [docs/v0.12-rc-benchmark.md, tests/test_adaptive_reference.py, tests/test_rc_benchmark.py]

  - id: DEC-018
    date: 2026-08-16
    decision: Replace Qwen3-8B with Qwen3.5-9B before official full campaigns while retaining exactly four Qwen entries.
    rationale: Qwen3.5-9B is the locally available current larger Qwen candidate and passed bounded RC1 compatibility screening; making the substitution before RC2 campaign freeze avoids a silent off-panel replacement.
    evidence: [benchmarks/rc/v0.12-model-panel.json, docs/v0.12-rc-benchmark.md]

  - id: DEC-019
    date: 2026-08-17
    decision: Request LM Studio non-thinking inference with reasoning_effort=none and retain observed reasoning tokens and characters as the independent conformance gate.
    rationale: The tested runtime accepted but ignored the legacy chat-template switch, accepted reasoning_effort=none with zero observed reasoning, and rejected reasoning_effort=off; prompt-level /no_think was rejected because it would mutate benchmark inputs.
    evidence: [benchmarks/rc/v0.12.0rc3-reasoning-control-audit.json, tests/test_openai_compatible.py, tests/test_reference_agent_lmstudio.py, tests/test_adaptive_reference.py]

  - id: DEC-020
    date: 2026-08-17
    decision: Automate the frozen RC panel with exact local inventory validation, single-model lifecycle control, before-and-after runtime identity checks, staged fail-closed gates, atomic checkpointing and SHA-256 artifact resume validation; never relabel RC3 outputs as RC4 evidence.
    rationale: A convenient all-model command must reduce operator error without weakening model/configuration identity, evidence immutability, stage separation or version provenance.
    evidence: [benchmarks/rc/v0.12.0rc4-automation-audit.json, tests/test_benchmark_automation.py, docs/v0.12-rc-benchmark.md]

  - id: DEC-021
    date: 2026-08-17
    decision: Report protected violations, attacked-workflow utility, attack-added diagnostic events, target failures and reasoning conformance separately with explicit numerators and denominators; do not produce a composite benchmark score.
    rationale: A single percentage would conceal whether a model preserved security, remained useful, failed generation or merely produced diagnostic drift, and would invite incorrect interpretations such as treating utility as security.
    evidence: [benchmarks/rc/v0.12.0rc4-automation-audit.json, tests/test_rc_benchmark.py, docs/v0.12-rc-benchmark.md]

  - id: DEC-022
    date: 2026-08-18
    decision: Attribute every non-exact model-generated value to all values visible to that generation and propagate their maximum confidentiality; permit lower confidentiality only through an explicit trusted declassifier.
    rationale: A model can copy prefixes, paraphrase, encode, summarize or combine inputs, so neither content equality nor absence of a full substring match proves independent public origin.
    evidence: [benchmarks/rc/v0.12.0rc5-tcb-regression-audit.json, src/vais/taint.py, tests/test_taint.py, tests/test_openai_compatible.py, tests/test_reference_agent_lmstudio.py]

  - id: DEC-023
    date: 2026-08-18
    decision: Preserve each model's highest reached benchmark stage and compute safety-critical headline totals across every executed stage, including gate failures; label those totals as distinct staged executions rather than a ranking denominator.
    rationale: Gate-triggering evidence must remain visible after the runner continues to later models, while readers must not compare unbalanced stage budgets as if they were one common cohort.
    evidence: [benchmarks/rc/v0.12.0rc5-tcb-regression-audit.json, tests/test_benchmark_automation.py, tests/test_rc_benchmark.py, docs/v0.12-rc-benchmark.md]

  - id: DEC-024
    date: 2026-08-18
    decision: Give all frozen panel models the same 4096-token truncation retry allowance and retain the first failed attempt in generation metadata.
    rationale: A cross-model protocol should not grant recovery only to selected model families, and recovery must not erase evidence that a physical attempt truncated.
    evidence: [benchmarks/rc/v0.12-model-panel.json, tests/test_rc_benchmark.py, docs/v0.12-rc-benchmark.md]

  - id: DEC-025
    date: 2026-08-19
    decision: Permit offline benchmark rerendering only after fail-closed checkpoint, manifest and artifact verification, and report evidence_version separately from renderer_version.
    rationale: Improving presentation must not relabel an old campaign, silently accept modified inputs or imply that a newer benchmark execution occurred.
    evidence: [src/vais/rc_benchmark.py, tests/test_rc_benchmark.py, benchmarks/rc/report/rc5-evidence-explained/report-evidence-manifest.json]

  - id: DEC-026
    date: 2026-08-19
    decision: Select representative report examples deterministically and structurally remove prompts, arguments, results, effect attributes, secret-bearing values and detailed invariant messages.
    rationale: Public reports need enough trace structure to explain enforcement without reproducing sensitive fixtures or treating raw traces as publication-safe.
    evidence: [src/vais/rc_benchmark.py, tests/test_rc_benchmark.py, benchmarks/rc/report/rc5-evidence-explained/technical-report.md]

  - id: DEC-027
    date: 2026-08-19
    decision: Explain protected violations, utility and attack-added events with separate formulas, denominators and paired outcomes and retain the prohibition on a composite benchmark score.
    rationale: The measures answer different questions; collapsing them would conceal configuration gates, target failures and the difference between diagnostic drift and verified protected impact.
    evidence: [docs/v0.12-rc-benchmark.md, benchmarks/rc/report/rc5-evidence-explained/executive-summary.md, benchmarks/rc/report/rc5-evidence-explained/technical-report.md]

  - id: DEC-028
    date: 2026-08-19
    decision: Keep the RC5 DeepSeek reasoning-off failure intact, then evaluate the model in RC7 as a separately labeled native-reasoning profile with observed reasoning required; bind every stage summary to its manifest reasoning label and control request and compare utility only within a reasoning profile.
    rationale: The tested DeepSeek model/runtime exposes no off configuration, and every non-prompt compatibility control still emitted reasoning. Relabeling that output as off or weakening the gate would invalidate the experiment, while excluding the family would reduce panel diversity. A separate cohort preserves both evidence and interpretability.
    evidence: [benchmarks/rc/v0.12.0rc7-deepseek-reasoning-audit.json, benchmarks/rc/v0.12-model-panel.json, tests/test_reasoning.py, tests/test_benchmark_automation.py]

  - id: DEC-029
    date: 2026-08-24
    decision: Freeze the completed RC7 panel with SmolLM3-3B visibly gate-failed, retain the uniform 4096-token retry protocol, and publish the 7168-token follow-up only as separate diagnostic evidence.
    rationale: The larger model-specific retry did not eliminate unrecovered truncation, changing one row's budget would break the common protocol, and target failures are unevaluated rather than successful defense or completed benchmark rows.
    evidence: [benchmarks/rc/v0.12.0rc8-rc7-freeze-audit.json, benchmarks/rc/report/rc7-full-evidence/technical-report.md, research/narrative/v0.12-rc8-rc7-benchmark-freeze-summary.md]

  - id: DEC-030
    date: 2026-08-24
    decision: Adopt VAIS Boundary as the public identity, expand VAIS as Verifiable Authority and Invariant Security, rename the canonical repository to vais-boundary, and retain the vais CLI/import plus verifiable-ai-security distribution for compatibility.
    rationale: The revised name describes the implemented authority and effect-verification boundary without implying universal AI-security proof or forcing an unnecessary package migration.
    evidence: [docs/naming.md, README.md, pyproject.toml]

  - id: DEC-031
    date: 2026-08-24
    decision: Treat observable effects as canonical immutable security evidence and apply the authorization boundary's type-sensitive and finite-number rules to declarative invariant evaluation.
    rationale: An independent verifier cannot remain independent or deterministic if its effect evidence can change after observation or if Python equality and non-finite comparisons create type-confused fail-open outcomes.
    evidence: [docs/v0.12.0rc9-release-review.md, src/vais/sandbox.py, src/vais/invariants.py, tests/test_invariants.py]

  - id: DEC-032
    date: 2026-08-24
    decision: Elide exception messages from protected and unprotected MCP records while preserving exception class, deterministic request identity, indeterminate state and unsafe-retry status.
    rationale: Assessment baselines still produce retained artifacts, so intentionally bypassing authorization does not justify persisting secret-bearing transport text.
    evidence: [src/vais/mcp.py, tests/test_mcp.py, docs/mcp-security.md]

  - id: DEC-033
    date: 2026-09-20
    decision: Bound security-value recursion and route the failure through the existing fail-closed canonicalization path rather than adding a broad exception handler, and record in LIM-033 that deeper nesting still fails in the adapter without a VAIS decision or audit entry.
    rationale: A guard that only catches ValueError cannot be protected by catching everything, because that would convert unknown faults into silent denials; bounding the input keeps one fail-closed path and leaves the residual visible.
    evidence: [src/vais/models.py, tests/test_fingerprint_recursion.py, docs/ATTACK-SURFACE.md]

  - id: DEC-034
    date: 2026-09-20
    decision: Keep the Tier-A lab experiment in the repository as an unpackaged evidence tree, with its pre-registrations, frozen inputs and raw episode records, and exclude it from the distributed sdist and wheel.
    rationale: The experiment depends on an external training application and on a local model server, so it is reproducible evidence for readers of the repository but not part of the installable library.
    evidence: [experiments/tier_a/PREREGISTRATION-v2.md, experiments/tier_a/RESULTS-v2.md, docs/v0.12.0rc10-release-review.md]

  - id: DEC-035
    date: 2026-09-21
    decision: Close the volume half of composition in VERIFY with a max_effect_count invariant type in RC11, and record the ENFORCE half as a documented limitation with no promised date rather than changing the reference monitor signature in the same release.
    rationale: The reviewer's complaint was that a bound was not expressible, and an aggregate invariant makes it expressible and independently checkable using the effect list the engine already receives. In-flight denial would change the signature of the central security function and require every adapter to thread a counter, which is the same class of obligation that LIM-033 already shows adapters can drop silently. Splitting the fix along the existing VERIFY and ENFORCE boundary keeps each half honest about what it does.
    evidence: [src/vais/invariants.py, tests/test_invariant_cardinality.py, docs/security-invariants.md]

  - id: DEC-036
    date: 2026-09-21
    decision: Test the provenance lattice with a seeded deterministic DAG generator and an independently written expected-label function, rather than adding a property-based testing dependency.
    rationale: This project records seeds and freezes inputs everywhere else, and a failing case from a fixed seed reproduces exactly, which matters more here than shrinking. The expected labels are written from the taint docstring rather than from the implementation, so the suite checks the stated rule instead of restating the code; mutation testing confirmed that five separate breakages of the lattice rules are each caught. Adding a dependency for one module was not justified when the runtime dependency footprint is a stated property of the project.
    evidence: [tests/test_provenance_lattice.py, src/vais/taint.py, docs/ATTACK-SURFACE.md]

  - id: DEC-037
    date: 2026-09-22
    decision: Leave the audit chain unsigned and unanchored for now, and record the demonstrated detection boundary in tests instead of narrowing the claim informally.
    rationale: Signing the chain moves key management into the trusted computing base and is a larger change than this release should carry, and the threat model already lists cryptographic tamper-evidence as a non-goal. What was missing was not the caveat but the demonstration, so each undetected manipulation is now asserted by a test that is expected to start failing if a signed head or external commitment is ever added.
    evidence: [tests/test_audit_chain_integrity.py, src/vais/audit.py, docs/threat-model.md]

  - id: DEC-038
    date: 2026-09-22
    decision: Make the approval store's in-memory change and its persist atomic with respect to each other by rolling the in-memory change back when the write fails, using a context manager that catches BaseException and re-raises it.
    rationale: The alternative orderings are worse. Persisting before updating memory would require serialising a state the store does not yet hold, and leaving the divergence in place lets a restart replay a spent approval. The handler is broad but it re-raises rather than swallowing, so it converts no fault into a silent decision and does not contradict DEC-033; it changes only whether memory and the stored record agree afterwards.
    evidence: [src/vais/approvals.py, tests/test_fault_injection.py, docs/ATTACK-SURFACE.md]

  - id: DEC-039
    date: 2026-09-22
    decision: Build the continuous campaign as a deterministic seeded mutation harness with its own triage, rather than adopting Atheris or libFuzzer, and gate CI on triage verdict rather than on whether any exception was raised.
    rationale: Determinism matches how this project records evidence everywhere else, since a finding replays exactly from a seed and index, and it avoids a platform-specific dependency that does not install on the Windows half of the test matrix. The cost is real and is recorded in LIM-042, namely that without coverage feedback the mutator is much less efficient than a guided fuzzer. Gating on verdict rather than on any raised exception is what makes the campaign usable at all, because a loader that rejects malformed input by raising is working correctly and would otherwise fail every run.
    evidence: [campaigns/README.md, tests/test_campaign_triage.py, src/vais/policy.py]

  - id: DEC-040
    date: 2026-09-22
    decision: Treat a call that fails after dispatch as its own outcome. Absent a verified violation, an episode containing an indeterminate call leaves the evaluable set in every scorer and is counted separately, and is never counted as defended.
    rationale: An indeterminate call produces no effect record, so the verifier sees nothing, and scoring that as secure would let a system look defended because its outcomes could not be observed. The rule matches the one already applied to target failures. A verified violation still counts because it was observed. The published snapshots record zero indeterminate calls, so no published result changes.
    evidence: [tests/test_indeterminate_outcome.py, src/vais/adaptive_reference.py, src/vais/mcp_benchmark.py]

  - id: DEC-041
    date: 2026-09-22
    decision: Accept a consumed ApprovalStore grant for the same fingerprint and identity as evidence that an effect was approved, and do not accept an unconsumed one.
    rationale: The effect already exists, so if it went through the store-backed decision its grant was consumed. An unconsumed grant beside an observed effect means the effect did not come through that decision, and a grant existing is not evidence that the effect was approved.
    evidence: [tests/test_approval_verify.py, src/vais/approvals.py, src/vais/invariants.py]

  - id: DEC-042
    date: 2026-09-22
    decision: Have approval_single_use report every repeated use of one exact approval above its threshold, including a genuine re-approval of an identical action.
    rationale: The store keeps one grant per identity, so after a grant, a consume, a second grant and a second consume it cannot show that the action was approved twice. Reporting the second effect for review is the conservative choice for a verifier, whose false positive costs a review while a false negative hides a replay. A test asserts the behaviour so it is revisited if the store starts counting grants.
    evidence: [tests/test_approval_verify.py, src/vais/invariants.py, docs/security-invariants.md]

  - id: DEC-043
    date: 2026-09-22
    decision: Record the action fingerprint and the contract identity in audit events on both enforcement paths, and never argument values.
    rationale: Before this an authorization event carried only argument names, so the chain could show that a payment was allowed but not which payment or for whom. The fingerprint is a SHA-256 of the canonical action and carries no argument value, so it adds identity without adding secrets, and it is the same value the approval store and the verifier use.
    evidence: [tests/test_audit_identity.py, src/vais/audit.py, src/vais/mcp.py]

  - id: DEC-044
    date: 2026-09-23
    decision: Make the reference monitor stateful by passing it a SessionLedger per session rather than by holding state in the monitor, and deny a tool that declares max_calls when no ledger is supplied.
    rationale: One monitor instance serves many sessions, so state held in it would mix sessions, while a ledger bound to one contract identity keeps each session's history separate and lets the caller decide its lifetime. Denying a declared limit without a ledger keeps the limit fail-closed, since silently allowing an action a policy says to bound is the failure this work exists to remove. The check and the record happen under the ledger's lock so concurrent decisions cannot both take the last call.
    evidence: [tests/test_session_ledger.py, src/vais/ledger.py, src/vais/monitor.py]

  - id: DEC-045
    date: 2026-09-23
    decision: Check call limits before approvals, and decide whether any approval is needed before consuming one, consuming at most once per decision.
    rationale: Consuming an approval and then denying the action for a separate reason spends a human's decision on nothing. Ordering the limit first and deciding the approval once removes that, and removing the second consume is also the fix for FIND-056.
    evidence: [tests/test_session_ledger.py, src/vais/monitor.py, docs/security-invariants.md]

  - id: DEC-046
    date: 2026-09-23
    decision: Add monitor_mediated as an opt-in invariant that reports effects no recorded ALLOW accounts for, checking in one direction only, and keep it out of the default set.
    rationale: Complete mediation cannot be enforced by a library but can be checked after the fact against the ledger ENFORCE wrote. An allowed call can fail before it takes effect, so an entry without an effect is expected and not reported, while an effect without an entry is exactly an unmediated effect. It stays out of the default set because it requires callers to pass the ledger to VERIFY and would otherwise fail closed for every caller that does not.
    evidence: [tests/test_session_ledger.py, src/vais/invariants.py, docs/security-invariants.md]

  - id: DEC-047
    date: 2026-09-23
    decision: Check a contract's validity window and the revocation list before anything else in the monitor, deny outside the window or when revoked, and read the clock only for contracts that carry a window.
    rationale: Whether authority still holds comes before what it authorizes, so an expired or revoked contract is denied without reaching the ledger or consuming an approval. Reading the clock only for time-bounded contracts keeps every other decision deterministic and independent of the time, which the fault-injection suite asserts with a clock that raises if read. Both mechanisms are optional, so existing callers see no change (LIM-047).
    evidence: [tests/test_authority_lifecycle.py, tests/test_fault_injection.py, src/vais/monitor.py, src/vais/revocation.py]

  - id: DEC-048
    date: 2026-09-23
    decision: Let an approval grant carry an expiry set from a TTL when it is granted, refuse an expired grant without consuming it, and keep grants without a TTL valid until consumed.
    rationale: A human's yes should stop counting after a bounded time, which answers the second external reviewer's freshness question for approvals. Leaving an expired grant unconsumed keeps the record truthful, since it was never used, and VERIFY does not count an unconsumed grant as approval. The expiry is stored as absolute time, so it survives persistence, and files written before the field existed still load.
    evidence: [tests/test_authority_lifecycle.py, src/vais/approvals.py]

  - id: DEC-049
    date: 2026-09-23
    decision: Make the approval store's file the source of truth, holding an operating-system lock and reloading from disk around every grant, consume and lookup, and raise if the lock cannot be acquired within the timeout.
    rationale: Each instance used to load the file once and trust its memory, so two workers could consume one grant (LIM-045). Reloading under the lock serializes processes on one machine, and six real processes racing on one file produce exactly one consume; a mutant without the lock failed that test on 5 of 5 runs. Raising on timeout keeps the store fail-closed, because nothing on the enforcement path catches it and so no decision is made without the lock (LIM-057).
    evidence: [tests/test_authority_lifecycle.py, src/vais/approvals.py]

  - id: DEC-050
    date: 2026-09-23
    decision: Add TaskContract.delegate, which derives a sub-agent contract that may only narrow its parent and raises on any widening, and key the SessionLedger by principal, session and tenant rather than by capability.
    rationale: A delegate keeps its parent's session and takes a new capability id. Keying the ledger by session is what makes attenuation hold in practice, since a delegate's calls count against the parent's limits and spending a contract-held approval spends the parent's, and revoking the session revokes every delegate in it. Raising rather than trimming makes a request for more than the parent holds a visible error. Store grants stay keyed by capability, so a delegate cannot consume a grant made for its parent. The monitor_mediated identity check follows the ledger, so ENFORCE and VERIFY agree on what one session is.
    evidence: [tests/test_authority_lifecycle.py, src/vais/models.py, src/vais/ledger.py, src/vais/invariants.py]

  - id: DEC-051
    date: 2026-09-23
    decision: At the gateway, label every argument from the agent as derived_untrusted at the session's confidentiality high-water mark, except a value exactly equal to its contract binding, which takes the binding's trusted label.
    rationale: The gateway exists so that the agent process need not be trusted, so it cannot accept labels the agent sends. This is derive_model_output's rule applied at the boundary, and it turns the re-labelling every integration had to write (LIM-053) into one library function. It is stricter than the library path, since a contract binding becomes the only route to trust, and coarser, since the level only rises within a session (LIM-061).
    evidence: [tests/test_gateway.py, src/vais/gateway.py, docs/gateway.md]

  - id: DEC-052
    date: 2026-09-23
    decision: Give the gateway its contracts and approvals through operator-owned files. Contracts are found by the SHA-256 of the agent's session token, and the gateway writes approval requests but never grants; an operator grants them into the shared ApprovalStore after the request's fingerprint is re-checked.
    rationale: Files need no new network surface and reuse the store that P1b-8 made safe across processes. Storing only the token digest means reading the directory does not reveal tokens. Re-reading the directory on every request makes deletion an immediate revocation. Two contracts with one digest, or a file that does not parse, grant nothing.
    evidence: [tests/test_gateway.py, src/vais/gateway.py, src/vais/cli.py]

  - id: DEC-053
    date: 2026-09-23
    decision: Withhold decision reasons from the agent by default at the gateway, returning the outcome only, and keep the reasons in the audit trail; reason_disclosure set to reasons restores them.
    rationale: Reason codes such as bound_argument_changed name the field a contract binds, which helps an adaptive attacker probe the policy (S13). The gateway is a new interface with no callers to keep compatible, so it can default to the safer choice that IMP-003 proposed; the library path is unchanged.
    evidence: [tests/test_gateway.py, src/vais/gateway.py]

  - id: DEC-054
    date: 2026-09-23
    decision: Resolve upstream credentials from the gateway's own environment through ${env:NAME} references, start stdio upstreams with the SDK's minimal environment plus only their configured variables, authorize every tool call from its own request's bearer token, and fail startup on a missing variable or a profile tool its upstream does not offer.
    rationale: Credentials never appear in configuration files, and the agent never receives them. An upstream does not inherit the gateway's other secrets. Authorizing from each request's token, not from the MCP session it arrives on, means a session identifier cannot carry one agent's authority to another. Failing at startup keeps a misconfiguration from becoming a partially mediated deployment.
    evidence: [tests/test_gateway_server.py, src/vais/gateway_server.py]

  - id: DEC-055
    date: 2026-09-23
    decision: Give actions an optional origin, the join of the labels visible when they were planned, excluded from the fingerprint, and let policy v6 set untrusted_origin per tool to allow, require_approval or deny, counting a missing origin as untrusted. Carry the origin on effects and check it in VERIFY with an opt-in trusted_origin invariant.
    rationale: LIM-048 exists because authority is judged per argument and nothing records why an action was proposed. The origin answers that from labels alone, keeping the rule that the monitor never reads content. Excluding it from the fingerprint keeps an approval bound to the action rather than to how it was planned. Treating a missing origin as untrusted means a caller cannot defeat the rule by omitting it. require_approval joins the single approval decision after call limits, so FIND-056 and DEC-045 still hold, and VERIFY applies the same rule so ENFORCE and VERIFY agree.
    evidence: [tests/test_action_origin.py, src/vais/taint.py, src/vais/monitor.py, src/vais/policy.py, src/vais/invariants.py]

  - id: DEC-056
    date: 2026-09-23
    decision: Do not recommend untrusted_origin as a default. Document it as an explicit per-tool switch that puts a human in front of a high-consequence tool, with its measured cost.
    rationale: The pre-registered decision rule required a control cost of at most 10% and a discrimination of at least 20 percentage points; on RC7 no tool set met it, and discrimination was zero everywhere (FIND-057). As a deliberate human gate on a tool such as a payment, it closes LIM-048 for that tool, including the PHANTOM-B expense case below its threshold, and that is a legitimate choice for an operator to make knowingly.
    evidence: [experiments/p1b6/RESULTS.md, experiments/p1b6/PREREGISTRATION.md]
