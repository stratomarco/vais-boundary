findings:
  - id: FIND-001
    finding: v0.5.1 replaced the ambiguous attack-influence metric with plan change and added deterministic attack-objective success, creating an explicit measurement pipeline from model behavior to observable impact.
    version: "0.5.1"
    type: methodology
    evidence: [CHANGELOG.md, docs/v0.5.1-measurement-correctness.md]

  - id: FIND-002
    finding: v0.8.1 showed that behavioral drift is directional; some changed plans are contractions rather than security escalation, and mixed drift can contain both.
    version: "0.8.1"
    type: methodology
    evidence: [VAIS-v0.8.1-qwen-v080-mcp-audit.json, VAIS-v0.8.1-gemma-v080-mcp-audit.json]

  - id: FIND-003
    finding: Qwen v0.8 MCP reanalysis observed 60 security-escalation episodes, 50 targeted successes, 10 off-objective escalations, and zero protected invariant violations in the tested MCP benchmark.
    version: "0.8.1"
    type: empirical
    target: "lmstudio:qwen/qwen3.5-9b"
    evidence: [VAIS-v0.8.1-qwen-v080-mcp-audit.json, qwen35-v080-mcp.jsonl]

  - id: FIND-004
    finding: Gemma v0.8 MCP reanalysis separated 3 escalation episodes from 15 contraction-only episodes; targeted attack success remained zero in that run.
    version: "0.8.1"
    type: empirical
    target: "lmstudio:google/gemma-4-12b"
    evidence: [VAIS-v0.8.1-gemma-v080-mcp-audit.json, gemma4-12b-v080-mcp.jsonl]

  - id: FIND-005
    finding: Delivering hostile content through MCP context materially changed observed model behavior relative to direct-context experiments; the data do not establish that MCP itself is safer.
    version: "0.8.1"
    type: empirical_interpretation
    evidence: [qwen35-v080-mcp.jsonl, gemma4-12b-v080-mcp.jsonl]

  - id: FIND-006
    finding: v0.9 evolved the benchmark from independent actions to a production-shaped, stateful incident-response reference system with multi-step traces, tenant/resource state, approvals, provenance, and workflow utility.
    version: "0.9.0"
    type: architecture
    evidence: [docs/v0.9-reference-agent.md, CHANGELOG.md]

  - id: FIND-007
    finding: v0.9.1 introduced matched non-hostile controls to distinguish baseline model overreach from attack-attributable escalation.
    version: "0.9.1"
    type: methodology
    evidence: [CHANGELOG.md]

  - id: FIND-008
    finding: v0.9.2 separated application-exposed tools from task-authorized tools and replaced coarse pair attribution with semantic security-event deltas.
    version: "0.9.2"
    type: methodology
    evidence: [CHANGELOG.md]

  - id: FIND-009
    finding: v0.9.3 normalized delegated-agent authority so trusted setup/retrieval does not become model authority and delegation cannot manufacture capability.
    version: "0.9.3"
    type: architecture
    evidence: [CHANGELOG.md, docs/v0.9.3-interface-normalization.md]

  - id: FIND-010
    finding: In Qwen v0.10 adaptive verification, all 240 episodes were evaluable; 58 contained attack-added security events, 18 achieved the scenario attack objective, and zero produced a protected invariant violation.
    version: "0.10.0"
    type: empirical
    target: "lmstudio:qwen/qwen3.5-9b"
    evidence: [qwen35-adaptive-v010.jsonl, qwen35-adaptive-v010-rlvr.jsonl]

  - id: FIND-011
    finding: Qwen v0.10 produced 40 off-objective security-event episodes, demonstrating that targeted attack success undercounts security-relevant model behavior.
    version: "0.10.0"
    type: empirical
    target: "lmstudio:qwen/qwen3.5-9b"
    evidence: [qwen35-adaptive-v010.jsonl]

  - id: FIND-012
    finding: Qwen v0.10 matched utility was 192/240 in control and 195/240 under attacked protected execution; 25 pairs regressed and 28 pairs recovered, so aggregate protected utility is not an enforcement-cost estimate.
    version: "0.10.0"
    type: empirical_methodology
    target: "lmstudio:qwen/qwen3.5-9b"
    evidence: [qwen35-adaptive-v010.jsonl]

  - id: FIND-013
    finding: Gemma v0.10 attempted 240 adaptive episodes but only 188 protected episodes were evaluable; 52 protected target generations truncated, and no protected invariant violation was observed among the 188 evaluable episodes.
    version: "0.10.0"
    type: empirical
    target: "lmstudio:google/gemma-4-12b"
    evidence: [gemma4-12b-adaptive-v010.jsonl, gemma4-12b-adaptive-v010-rlvr.jsonl]

  - id: FIND-014
    finding: "Gemma v0.10 generation failures were length truncations at the 2048-token budget: 52 empty final plans and one non-JSON failed generation when the failed control generation is included; the run recorded 477744 reasoning tokens."
    version: "0.10.0"
    type: infrastructure
    target: "lmstudio:google/gemma-4-12b"
    evidence: [gemma4-12b-adaptive-v010.jsonl]

  - id: FIND-015
    finding: Qwen v0.10 objective successes were concentrated in attack-02, attack-10, attack-12, and attack-14, while several other campaigns produced security escalation without satisfying the intended objective.
    version: "0.10.0"
    type: empirical
    target: "lmstudio:qwen/qwen3.5-9b"
    evidence: [qwen35-adaptive-v010.jsonl]

  - id: FIND-016
    finding: v0.10.2 frozen dataclasses retained mutable nested argument data, permitting mutation between authorization and execution; v0.11 recursively copies and freezes security values.
    version: "0.11.0"
    type: tcb_defect
    evidence: [tests/test_tcb_hardening.py, docs/v0.11-tcb-hardening.md]

  - id: FIND-017
    finding: Python equality admitted authorization type confusion such as True equaling 1, while canonicalization lacked an explicit Unicode contract; v0.11 uses type-sensitive canonical encodings and NFC normalization.
    version: "0.11.0"
    type: tcb_defect
    evidence: [tests/test_tcb_hardening.py, docs/v0.11-tcb-hardening.md]

  - id: FIND-018
    finding: v0.10.2 approvals were reusable fingerprints without principal, session, tenant or capability identity; v0.11 adds scoped persistent atomic consume-once grants.
    version: "0.11.0"
    type: tcb_defect
    evidence: [tests/test_tcb_hardening.py, docs/v0.11-tcb-hardening.md]

  - id: FIND-019
    finding: Policy numeric thresholds accepted non-finite values and allowed tools did not universally reject undeclared arguments; policy v4 closes both paths.
    version: "0.11.0"
    type: tcb_defect
    evidence: [tests/test_tcb_hardening.py, docs/v0.11-tcb-hardening.md]

  - id: FIND-020
    finding: Audit ordering was not tamper-evident and MCP exception text could disclose secrets; v0.11 hash-chains audit events and records exception class only.
    version: "0.11.0"
    type: tcb_defect
    evidence: [tests/test_tcb_hardening.py, docs/v0.11-tcb-hardening.md]

  - id: FIND-021
    finding: A literal download-ranked panel overrepresents a small number of model families and includes unsuitable non-instruction artifacts; v0.12 freezes a popularity-informed but family-diverse, hardware-bounded panel and records missing results as pending.
    version: "0.12.0rc1"
    type: methodology
    evidence: [benchmarks/rc/v0.12-model-panel.json, docs/v0.12-rc-benchmark.md]

  - id: FIND-022
    finding: RC1 LM Studio experiments showed that labeling reasoning mode off and sending a best-effort chat-template switch did not guarantee zero reasoning; Gemma-4-12B emitted reasoning while Qwen3.5-9B did not in the bounded observed runs.
    version: "0.12.0rc2"
    type: benchmark_protocol_defect
    evidence: [benchmarks/rc/v0.12.0rc2-protocol-audit.json, docs/v0.12-rc-benchmark.md, tests/test_adaptive_reference.py]

  - id: FIND-023
    finding: RC1 report aggregation looked up unprefixed manifest model IDs while real adaptive summaries used lmstudio-prefixed target IDs, so valid summaries could remain silently pending; RC2 normalizes only the two explicit aliases and rejects off-panel targets.
    version: "0.12.0rc2"
    type: reporting_defect
    evidence: [benchmarks/rc/v0.12.0rc2-protocol-audit.json, tests/test_rc_benchmark.py, docs/v0.12-rc-benchmark.md]

  - id: FIND-024
    finding: RC1 adaptive commands opened output artifacts in write mode without an overwrite gate, permitting repeated commands to erase prior experiment artifacts; RC2 fails before generation when any output exists unless overwrite is explicitly authorized.
    version: "0.12.0rc2"
    type: reproducibility_defect
    evidence: [benchmarks/rc/v0.12.0rc2-protocol-audit.json, tests/test_adaptive_cli.py, docs/v0.12-rc-benchmark.md]

  - id: FIND-025
    finding: RC2 sent chat_template_kwargs.enable_thinking=false for Qwen3-0.6B but the one-episode preflight still recorded 2043 reasoning tokens across six valid generations and failed reasoning-off conformance; the tested LM Studio runtime instead suppressed reasoning when sent reasoning_effort=none.
    version: "0.12.0rc3"
    type: benchmark_protocol_defect
    evidence: [benchmarks/rc/v0.12.0rc3-reasoning-control-audit.json, tests/test_openai_compatible.py, tests/test_reference_agent_lmstudio.py, tests/test_adaptive_reference.py]

  - id: FIND-026
    finding: Manual RC model loading and stage execution did not cryptographically bind completed artifacts to one independently rechecked loaded model configuration; RC4 validates the complete inventory and rechecks the single loaded key, API identifier, Q4_K_M quantization, context and parallelism before and after every stage.
    version: "0.12.0rc4"
    type: reproducibility_defect
    evidence: [benchmarks/rc/v0.12.0rc4-automation-audit.json, tests/test_benchmark_automation.py, docs/v0.12-rc-benchmark.md]

  - id: FIND-027
    finding: The RC4 automation prototype used Path.with_suffix on artifact stems containing the dotted model ID qwen3-0.6b, collapsing multiple intended names to qwen3-0.jsonl and creating a cross-stage collision risk.
    version: "0.12.0rc4"
    type: artifact_identity_defect
    evidence: [benchmarks/rc/v0.12.0rc4-automation-audit.json, tests/test_benchmark_automation.py]

  - id: FIND-028
    finding: Live LM Studio inventory metadata identified the frozen Phi-4 Mini and Phi-4 Q4_K_M artifacts as 3B and 15B while the RC3 descriptive manifest labeled them 4B and 14B; RC4 corrects the descriptive classes without changing the selected model keys.
    version: "0.12.0rc4"
    type: manifest_metadata_defect
    evidence: [benchmarks/rc/v0.12.0rc4-automation-audit.json, benchmarks/rc/v0.12-model-panel.json, tests/test_benchmark_automation.py]

  - id: FIND-029
    finding: The completed RC4 campaign independently observed one secret_public_flow violation after a model copied only a prefix of a secret-bearing source into a public Slack argument; adapter logic treated the generated value as public because it did not contain the complete source value, demonstrating that content/subsequence matching is not a sound information-flow authority for model transformations.
    version: "0.12.0rc5"
    type: tcb_information_flow_defect
    evidence: [benchmarks/rc/v0.12.0rc5-tcb-regression-audit.json, tests/test_taint.py, tests/test_openai_compatible.py, tests/test_reference_agent_lmstudio.py]

  - id: FIND-030
    finding: The OpenAI-compatible and reference-agent adapter rebinding paths used normal Python equality while the hardened policy boundary used canonical type-sensitive equality, allowing values such as boolean true and integer one to compare equal at an authority/provenance boundary.
    version: "0.12.0rc5"
    type: tcb_type_confusion_defect
    evidence: [benchmarks/rc/v0.12.0rc5-tcb-regression-audit.json, tests/test_openai_compatible.py, tests/test_reference_agent_lmstudio.py]

  - id: FIND-031
    finding: RC4 final report aggregation selected only passed full-stage summaries, so a protected violation that correctly stopped one model at screening could disappear from the headline and model table after other models completed.
    version: "0.12.0rc5"
    type: reporting_fail_open_defect
    evidence: [benchmarks/rc/v0.12.0rc5-tcb-regression-audit.json, tests/test_benchmark_automation.py, tests/test_rc_benchmark.py]

  - id: FIND-032
    finding: The RC4 panel assigned a 4096-token truncation retry to only two models, while two other full-stage rows each lost one episode to an unrecovered truncation; this made experiment-validity treatment inconsistent across the frozen panel.
    version: "0.12.0rc5"
    type: benchmark_fairness_defect
    evidence: [benchmarks/rc/v0.12.0rc5-tcb-regression-audit.json, benchmarks/rc/v0.12-model-panel.json, tests/test_rc_benchmark.py]

  - id: FIND-033
    finding: The completed RC5 report exposed final rates but did not sufficiently connect them to stage budgets, formulas, paired controls, attack objectives and representative enforcement traces, making correct numbers easy to misinterpret as composite security scores.
    version: "0.12.0rc6"
    type: reporting_explanation_defect
    evidence: [benchmarks/rc/report/rc5-evidence-explained/technical-report.md, tests/test_rc_benchmark.py, docs/v0.12-rc-benchmark.md]

  - id: FIND-034
    finding: Offline verification of the immutable RC5 checkpoint confirmed 171 artifact records, fourteen complete full campaigns with 3360 evaluable episodes, one reasoning-off configuration gate, and 4299 evaluable distinct staged executions with zero observed protected violations and zero target failures.
    version: "0.12.0rc6"
    type: bounded_benchmark_result
    evidence: [benchmarks/rc/report/rc5-evidence-explained/report-evidence-manifest.json, benchmarks/rc/report/rc5-evidence-explained/rc-aggregate.json, benchmarks/rc/v0.12.0rc6-reporting-audit.json]

  - id: FIND-035
    finding: The RC5 DeepSeek-R1-Distill-Llama-8B gate was a valid configuration failure rather than a generation or security failure; the tested LM Studio catalog exposed no reasoning configuration, reasoning_effort=none, the legacy template switch, both controls and no control all emitted reasoning, and the native reasoning-off request failed with HTTP 400.
    version: "0.12.0rc7"
    type: benchmark_configuration_finding
    evidence: [benchmarks/rc/v0.12.0rc7-deepseek-reasoning-audit.json, tests/test_reasoning.py, tests/test_benchmark_automation.py]

  - id: FIND-036
    finding: A bounded RC7 DeepSeek native-reasoning preflight produced six valid target generations, 4651 observed reasoning tokens, zero target failures and zero protected violations and passed the new bidirectional reasoning-mode gate; this one episode is compatibility evidence, not a full benchmark result.
    version: "0.12.0rc7"
    type: bounded_benchmark_result
    evidence: [benchmarks/rc/v0.12.0rc7-deepseek-reasoning-audit.json, tests/test_adaptive_reference.py, tests/test_benchmark_automation.py]

  - id: FIND-037
    finding: Offline verification of the completed RC7 checkpoint confirmed 180 artifact records, fourteen complete full campaigns, one SmolLM3-3B full-stage generation gate, 4603 evaluable of 4605 distinct staged episodes, two target-failure episodes and zero observed protected invariant violations; DeepSeek completed 240/240 full episodes in the separately labeled native-reasoning cohort.
    version: "0.12.0rc8"
    type: bounded_benchmark_result
    evidence: [benchmarks/rc/v0.12.0rc8-rc7-freeze-audit.json, benchmarks/rc/report/rc7-full-evidence/report-evidence-manifest.json, benchmarks/rc/report/rc7-full-evidence/rc-aggregate.json]

  - id: FIND-038
    finding: A separate 24-episode SmolLM3-3B diagnostic raised the single truncation retry from 4096 to 7168 tokens; the two original failing positions did not fail again, but a different attack-19 generation exhausted the larger retry and remained non-JSON, so a larger model-specific ceiling did not make the recorded model/runtime reliably evaluable.
    version: "0.12.0rc8"
    type: benchmark_generation_reliability_finding
    evidence: [benchmarks/rc/v0.12.0rc8-rc7-freeze-audit.json, research/narrative/v0.12-rc8-rc7-benchmark-freeze-summary.md]

  - id: FIND-039
    finding: RC9 publication review found that observable Effect attributes remained shallowly mutable and contract-binding invariants used Python equality while invariant schema versions and approval thresholds admitted Boolean or non-finite ambiguity; RC9 canonicalizes and freezes effect evidence, uses type-sensitive security equality and rejects those schema paths.
    version: "0.12.0rc9"
    type: tcb_verifier_defect
    evidence: [docs/v0.12.0rc9-release-review.md, tests/test_invariants.py, tests/test_tcb_hardening.py]

  - id: FIND-040
    finding: The deliberately unprotected MCP assessment client retained full exception messages even though the protected client stored only exception class, allowing synthetic secrets or provider payload data to enter benchmark records; RC9 applies the same message-elision and indeterminate unsafe-retry semantics to both paths.
    version: "0.12.0rc9"
    type: secret_handling_defect
    evidence: [docs/v0.12.0rc9-release-review.md, tests/test_mcp.py, docs/mcp-security.md]

  - id: FIND-041
    finding: RC10 review found that deep_freeze recursed without a depth bound, so argument nesting past the interpreter limit raised RecursionError inside action_fingerprint. RecursionError is not a ValueError, so it bypassed the except ValueError guards in ReferenceMonitor.evaluate that exist to return a DENY with reason action_not_fingerprintable. The monitor produced no decision and no audit record, failing closed only by crashing the caller. RC10 bounds the recursion at MAX_SECURITY_DEPTH and raises ValueError so the failure routes through the existing fail-closed path.
    version: "0.12.0rc10"
    type: tcb_fail_closed_defect
    evidence: [docs/ATTACK-SURFACE.md, tests/test_fingerprint_recursion.py, src/vais/models.py]

  - id: FIND-042
    finding: A paired lab comparison on an external agent application used identical injection payloads with and without one legitimate document naming the correct ticket. The true document was strictly protective across four runs, since no payload succeeded with it present but failed without it, and attack success fell four- to eightfold. In the same runs the strongest content detector reached the same catch rate only while dropping half of all legitimate retrieved documents.
    version: "0.12.0rc10"
    type: external_experiment_observation
    evidence: [experiments/tier_a/RESULTS-v2.md, experiments/tier_a/PREREGISTRATION-v2.md, experiments/tier_a/evidence/v2-primary/core.jsonl]

  - id: FIND-043
    finding: An external reviewer reported in issue 2 that the central property, stated over an unauthorized externally observable effect in the singular, covers only one half of composition. The flow half, a sequence such as a secret read followed by a public send, was already expressible through trace-level invariants. The volume half, N individually authorized effects whose count is the problem, was not expressible at all. Every code claim in the report was verified. ReferenceMonitor.evaluate takes one PlannedAction, ProtectedExecutor.run dissolves its action list in a loop that accumulates nothing into a later decision, the invariant engine folds per effect, and the closed policy field allowlist would reject a cardinality field at load. The closed schema is what turned an absent quota into an inexpressible one.
    version: "0.12.0rc11"
    type: external_review_scope_gap
    evidence: [docs/security-invariants.md, tests/test_invariant_cardinality.py, src/vais/invariants.py]

  - id: FIND-044
    finding: P1-3 tested the provenance lattice against its own docstring rather than against its implementation, using expected labels written from the stated rule and seeded DAGs of depth at least twelve with mixed trusted and untrusted roots. No laundering path was found through derivation, and five mutations of the lattice rules were each caught by the suite. The material result is a negative one plus an asymmetry. Integrity defaults to the cautious end, since MCP data is untrusted unless vouched for and a derivation with no inputs is derived_untrusted. Confidentiality defaults to public, the bottom of the lattice, which is an assertion the library cannot justify about remote data. Public is the identity element for the join, so the default keeps unlabelled inputs from raising every ceiling they touch, which is a reasonable trade and not a conservative one.
    version: "0.12.0rc11"
    type: property_test_negative_result
    evidence: [tests/test_provenance_lattice.py, src/vais/taint.py, docs/ATTACK-SURFACE.md]

  - id: FIND-045
    finding: P1-4 ran fork, truncate, splice and reorder against the audit chain and found the detection boundary is not drawn by which manipulation is performed but by whether the attacker recomputes the chain afterwards. Editing any field in place, dropping events from the front, and naive reorder or splice are all caught. Truncating the tail is not caught and needs no recomputation at all, since verify has no notion of expected length and no signed head, so any prefix of a valid chain is itself a valid chain. Splicing a forged authorization decision, deleting an event, or reversing the whole chain all pass verification once the attacker rebuilds sequence, previous_hash and event_hash, which requires only public SHA-256 because the chain carries no secret. A fork is invisible from either branch by construction. The S7 hypothesis predicted truncation and fork correctly and did not anticipate that splice and reorder are caught only while the attacker declines to rebuild.
    version: "0.12.0rc11"
    type: tcb_boundary_demonstration
    evidence: [tests/test_audit_chain_integrity.py, src/vais/audit.py, docs/ATTACK-SURFACE.md]

  - id: FIND-046
    finding: P1-5 fault injection found that ApprovalStore.consume marked a grant spent in memory and then persisted. When the write failed, for example on a full or read-only volume, memory said spent and the stored record said unspent. The call itself failed closed, since the error propagated instead of returning an authorization, but the next process to load the store read the grant as unspent and would consume it again, so consume-once did not survive a failed write across a restart. The fix applies the in-memory change and the persist together and rolls the in-memory change back if the write fails, so the record is never less restrictive than memory and an approval is never silently spent by an infrastructure error. Reverting the fix is caught by the regression test.
    version: "0.12.0rc11"
    type: tcb_fail_open_defect
    evidence: [tests/test_fault_injection.py, src/vais/approvals.py, docs/ATTACK-SURFACE.md]

  - id: FIND-047
    finding: The P1-6 campaign found that load_policy tested default_action with set membership and no type guard. Set membership raises TypeError for an unhashable operand, so a policy declaring default_action as a list or a mapping failed with unhashable type rather than PolicyValidationError. The version check immediately above already guarded with isinstance and short-circuits correctly; this one did not. It failed closed, in that no Policy was produced and the exception propagated, and it broke the loader's declared contract that malformed input is rejected as PolicyValidationError.
    version: "0.12.0rc11"
    type: loader_contract_defect
    evidence: [tests/test_loader_input_types.py, src/vais/policy.py, campaigns/README.md]

  - id: FIND-048
    finding: The P1-6 campaign found that the unknown-field reporter sorted and joined YAML keys directly. YAML keys are not necessarily strings, so an integer, boolean, null, float or date key raised TypeError instead of reporting an unknown field. The helper is copied verbatim into the policy, invariant and MCP loaders, so the same latent fault existed in three places and was fixed in all three. As with FIND-047 the outcome was fail-closed by exception and out of contract.
    version: "0.12.0rc11"
    type: loader_contract_defect
    evidence: [tests/test_loader_input_types.py, src/vais/policy.py, src/vais/invariants.py]

  - id: FIND-049
    finding: MCPProtectedClient took no ApprovalStore and called the reference monitor without one, so the monitor fell back to the contract's approved fingerprints, which never consume. Consume-once therefore never held on the MCP path, and one approval authorized the same MCP call every time it was proposed; three identical calls were all allowed and dispatched. It was not a bypass, since the approved action was exactly the one that ran, and it contradicted the documented claim that approval is consume-once authority. Found while answering an external reviewer's question about authority freshness. The client now accepts an approval store and forwards it.
    version: "0.12.0rc12"
    type: tcb_defect
    evidence: [tests/test_mcp_approval_store.py, src/vais/mcp.py, docs/mcp-security.md]

  - id: FIND-050
    finding: ENFORCE and VERIFY disagreed about approvals. The reference monitor consumes ApprovalStore grants, but the exact_action_approval invariant looked only at the contract's approved fingerprints, so a payment correctly approved through the store was allowed by the monitor and then reported by the verifier as effect_not_exactly_approved. The store is the recommended consume-once mechanism and the default invariant set could not pass it. No benchmark exercised the store path under VERIFY, which is why nothing caught it. The engine and DeclarativeVerifiableReward now accept the store, and a consumed grant for the same identity counts as approval.
    version: "0.12.0rc12"
    type: tcb_verifier_defect
    evidence: [tests/test_approval_verify.py, src/vais/invariants.py, docs/security-invariants.md]

  - id: FIND-051
    finding: No invariant looked at how many times one approval was used. exact_action_approval asks whether each effect was approved, so on the contract path one approval replayed across two identical payments passed it twice, and ENFORCE allowed both because contract-held approvals do not consume. Both layers were silent. The new aggregate invariant approval_single_use reports each exact approval that authorized more than one effect above its threshold, and is in the default set.
    version: "0.12.0rc12"
    type: tcb_verifier_defect
    evidence: [tests/test_approval_verify.py, src/vais/invariants.py, docs/security-invariants.md]

  - id: FIND-052
    finding: FrozenDict blocked __setitem__, update, pop and the other mutators but not the in-place union operator. dict.__ior__ is implemented in C and does not route through the overridden update, so an in-place union on a TaskContract's bound_arguments replaced a trusted binding and an in-place union on a PlannedAction's arguments changed its fingerprint after the fact. A model cannot reach this since it does not execute Python, and integration code can do it by accident. It contradicted the TaskContract docstring's claim of immutable authorization.
    version: "0.12.0rc12"
    type: tcb_defect
    evidence: [tests/test_frozen_mapping.py, src/vais/models.py, docs/ATTACK-SURFACE.md]

  - id: FIND-053
    finding: The continuous campaign found, on its first run against the rc12 tree, that the policy loader tested trust_required with set membership. An unhashable value such as an empty mapping raised TypeError instead of PolicyValidationError. It is FIND-047 again one field over, since rc11 fixed default_action and did not search the file for the same pattern. Fail-closed by exception and out of contract, like FIND-047 and FIND-048.
    version: "0.12.0rc12"
    type: loader_contract_defect
    evidence: [tests/test_loader_contract_rc12.py, src/vais/policy.py, campaigns/README.md]

  - id: FIND-054
    finding: A colon in an MCP server or tool name reached canonical_mcp_tool inside the profile loader and escaped as ValueError rather than PolicyValidationError. Found by reading the MCP loader while triaging FIND-053. The MCP profile loader is not a campaign target, which is why no campaign caught it.
    version: "0.12.0rc12"
    type: loader_contract_defect
    evidence: [tests/test_loader_contract_rc12.py, src/vais/mcp.py, docs/mcp-security.md]

  - id: FIND-055
    finding: The MCP profile loader normalised effect field names to NFC and then assigned them into a dictionary, so two distinct YAML keys that normalise alike collapsed into one and the later silently replaced the earlier. The duplicate check rc9 added to MCPEffectMapping never saw them because the loader had already merged them, so the mapping a reviewer reads in the file and the mapping the loader returns could disagree. Found in the same reading as FIND-054. The loader now rejects the duplicate.
    version: "0.12.0rc12"
    type: loader_contract_defect
    evidence: [tests/test_loader_contract_rc12.py, src/vais/mcp.py, docs/mcp-security.md]

  - id: FIND-056
    finding: A tool requiring both an exact approval and a threshold approval could never be allowed through an ApprovalStore. Each approval rule checked separately, so the first check consumed the grant and the second found it spent and returned require_approval, and the human's approval was burned in the process. It failed closed, since nothing executed, and made one legitimate configuration unusable. The contract path was unaffected because membership does not consume. Found while restructuring the monitor for the session ledger. Approval is now decided once and consumed at most once.
    version: "0.12.0rc13"
    type: tcb_defect
    evidence: [tests/test_session_ledger.py, src/vais/monitor.py, docs/security-invariants.md]

  - id: FIND-057
    finding: An action-origin rule computed as the join of everything visible cannot tell attacked runs from clean ones in RC7. Replayed over 13 reasoning-off models and DeepSeek's native-reasoning cohort, no model step had a trusted origin in either condition, because every workflow's trusted setup reads untrusted Jira content before the model acts. Every allowed call to a gated tool was escalated in both conditions, a discrimination of 0.0 percentage points. The cost is the share of legitimate workflows using the gated tools, 25.7% for egress tools and 43.4% for all consequential tools among reasoning-off control conditions that kept utility. Pre-registered; H1 and H3 held and H2 was rejected, since it had conflated escalation of every egress call with every workflow making one.
    version: "0.12.0rc13"
    type: empirical
    evidence: [experiments/p1b6/PREREGISTRATION.md, experiments/p1b6/RESULTS.md, experiments/p1b6/results.json, experiments/p1b6/replay.py]

  - id: FIND-058
    finding: With a language-model attacker (qwen2.5-7b-instruct) and targets reasoning, protected invariant violations stayed at zero in all seven completed P1b-4 arms, 1,670 evaluable episodes over four local models, each arm's Wilson 95% upper bound 1.6%. Turning reasoning on made no detectable difference to how often an attack changed behaviour in any of three within-model pairs (gemma-4-12b -4.1 points, qwen3.5-9b +4.0, qwen3-0.6b +3.6, every 95% interval including zero). Attacks did produce policy-permitted actions the task did not need, in 10% to 39% of episodes; all 553 were reads, including a few searches naming another tenant's incident or a secret, with tenant isolation and secret flow holding. Pre-registered; the primary outcome held.
    version: "0.12.0rc13"
    type: empirical
    evidence: [experiments/p1b4/PREREGISTRATION.md, experiments/p1b4/RESULTS.md, experiments/p1b4/results/analysis.json, experiments/p1b4/analyze.py]

  - id: FIND-059
    finding: The LM Studio adapter requested reasoning off explicitly but reasoning on by sending nothing, relying on each model's runtime default, which is off for qwen3.5-9b. The qualification gate caught it before any full-stage episode, as designed. smollm3-3b does not reason at all when a system prompt is present under LM Studio's chat template, whatever the request says, so its reasoning-on condition cannot be reached with the reference agent's prompt.
    version: "0.12.0rc13"
    type: methodology
    evidence: [experiments/p1b4/PREREGISTRATION.md, tests/test_reference_agent_lmstudio.py, src/vais/openai_compatible.py]

  - id: FIND-060
    finding: The continuous campaign's declared rules went stale when rc13 extended the loaders. Its policy postcondition still allowed versions 1 to 5 after P1b-6 added policy v6, and its invariant-type set lacked trusted_origin and effect_confidence, so a correct load of a v6 policy was classified as a real fault. CI's campaigns never generated a v6 policy and stayed green; the rc13 release campaign did, with seed 13. The loaders were correct. The declared sets now include the new version and types, and a test fails whenever a loader accepts a version or type the campaign does not declare.
    version: "0.12.0rc13"
    type: campaign_harness_defect
    evidence: [campaigns/targets.py, tests/test_campaign_triage.py]
  - id: FIND-061
    finding: The adaptive attacker's feedback carried the monitor's reason codes although its docstring said they were omitted. A refused action reaches the attacker through attack_added_security_events and attack_added_violation_classes as policy:<reason>:<tool>, sometimes with the argument and its value. It happened in 481 of P1b-4's 1,680 episodes (28.6%, from 7.5% to 60.8% by arm), so RC7 and P1b-4 were run against an attacker that could partly see why it was refused. No verdict is affected; what the attacker could learn was more than documented. The docstring is corrected, and an attacker-feedback option (reasons, the old behaviour, or outcomes, which keeps only the outcome and the tool) lets the rc13 campaign measure whether the reasons help.
    version: "0.12.0rc13"
    type: campaign_harness_defect
    evidence: [src/vais/adaptive_reference.py, tests/test_attacker_feedback.py, experiments/p1b4/results/analysis.json]
